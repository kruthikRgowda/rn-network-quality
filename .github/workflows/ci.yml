name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up project
        uses: ./.github/actions/setup
      - run: yarn lint
      - run: yarn typecheck

  test:
    name: TypeScript tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up project
        uses: ./.github/actions/setup
      - run: yarn test --coverage --runInBand
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-coverage
          path: coverage
          if-no-files-found: error

  build-library:
    name: Build and inspect package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up project
        uses: ./.github/actions/setup
      - run: yarn codegen:check
      - run: yarn prepare
      - run: yarn pack:check

  build-android:
    name: Android example and JVM tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up project
        uses: ./.github/actions/setup
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Install Android SDK 37
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'cmdline-tools;latest'
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --list | grep 'platforms;android-3'
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Run Kotlin tests and assemble example
        working-directory: example/android
        run: ./gradlew :rn-network-quality:testDebugUnitTest :rn-network-quality:lintDebug :app:assembleDebug --no-daemon --console=plain

  build-ios:
    name: iOS example
    runs-on: macos-latest
    env:
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up project
        uses: ./.github/actions/setup
      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Set up Ruby and gems
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
          working-directory: example
      - name: Cache CocoaPods downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            example/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock', 'example/Gemfile.lock', 'yarn.lock', '*.podspec') }}
      - name: Install pods
        working-directory: example
        run: bundle exec pod install --project-directory=ios
      - name: Build simulator app
        working-directory: example/ios
        run: >-
          xcodebuild
          -workspace RnNetworkQualityExample.xcworkspace
          -scheme RnNetworkQualityExample
          -sdk iphonesimulator
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
